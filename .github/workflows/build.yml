name: Build and Release

# Builds Release UF2s for supported boards on every push/PR, and publishes
# GitHub Releases with those UF2s when pushing to master or develop.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          # Maintainer-supported / commonly flashed boards
          - PI_PICO
          - PI_PICO2
          - PI_PICOW
          - PI_PICO2W
          - RP2040_ZERO
          - RP2350_ZERO
          - RP2350_USB_A
          - RP2040_XIAO
          - RP2354
          - OGX_LIVE
          - ADAFRUIT_FEATHER
          - EXTERNAL_4CH_I2C
          - ESP32_BLUEPAD32_I2C
          - ESP32_BLUERETRO_I2C

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Get Pico SDK 2.1.0
        run: |
          git clone --branch 2.1.0 --depth 1 --recurse-submodules \
            https://github.com/raspberrypi/pico-sdk.git \
            "${{ github.workspace }}/Firmware/external/pico-sdk"

      - name: Build ${{ matrix.board }}
        working-directory: Firmware/RP2040
        run: |
          set -euo pipefail
          BUILD_DIR="${{ github.workspace }}/build-${{ matrix.board }}"
          OUT_DIR="${{ github.workspace }}/output"
          mkdir -p "$BUILD_DIR" "$OUT_DIR"

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DPICO_SDK_PATH="${{ github.workspace }}/Firmware/external/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOGXM_BOARD=${{ matrix.board }} \
            -DMAX_GAMEPADS=1

          cmake --build "$BUILD_DIR"

          UF2=$(find "$BUILD_DIR" -maxdepth 1 -name "OGX-Mini-*-${{ matrix.board }}*.uf2" | head -n 1)
          if [ -z "$UF2" ]; then
            echo "No UF2 produced for ${{ matrix.board }}"
            find "$BUILD_DIR" -maxdepth 2 -name '*.uf2' -print || true
            exit 1
          fi
          cp -v "$UF2" "$OUT_DIR/"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.board }}
          path: output/*.uf2
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for version file)
        uses: actions/checkout@v4

      - name: Download UF2 artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect UF2s and version metadata
        id: meta
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f -name '*.uf2' -exec cp -v {} release-files/ \;
          ls -lh release-files/

          FW_VERSION=$(sed -n 's/^set(FW_VERSION "\(.*\)")/\1/p' Firmware/FWDefines.cmake | head -1)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" = "master" ]; then
            TAG="${FW_VERSION}-${SHORT_SHA}"
            NAME="OGX-Mini ${FW_VERSION} (${SHORT_SHA})"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            # Rolling develop prerelease (same tag updated each push)
            TAG="develop-latest"
            NAME="OGX-Mini develop (${FW_VERSION}, ${SHORT_SHA})"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

          echo "fw_version=${FW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          {
            echo "## Firmware ${FW_VERSION}"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- Commit: [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- Built automatically by GitHub Actions"
            echo
            echo "### UF2 files"
            echo
            for f in release-files/*.uf2; do
              echo "- \`$(basename "$f")\`"
            done
          } > release-notes.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release-files/*.uf2
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
