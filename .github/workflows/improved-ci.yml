# OGX-Mini-improved CI: shared-sources and documentation checks, host unit tests, Pico 2 W firmware
# builds (also the Pico 2 + ESP32 hybrid's USB side) and the ESP32 companion firmware (RP2040 boards: every OGXM_BOARD is built by build.yml).
# Kept separate from the upstream build.yml so upstream merges stay conflict-free.
# Runs on every pull request: a PR is ready to merge only when every job passes
# (how to run the tests locally: docs/TESTING.md).
name: OGX-Mini-improved CI

on:
  push:
    branches: ["master", "main", "phase*"]
  pull_request:
  workflow_dispatch:

# A new push to the same PR / branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_TAG: "2.1.0"

jobs:
  host-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Network steps retry (up to 5 attempts, each with a time limit; .github/scripts/retry.sh).
      - name: Checkout required submodules
        run: |
          .github/scripts/retry.sh 5 10m -- git submodule update --init --recursive --depth 1 \
            Firmware/external/bluepad32 Firmware/external/libfixmath Firmware/external/tinyusb

      - name: Install toolchain
        env:
          APT_OPTS: >-
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=120
        run: |
          .github/scripts/retry.sh 5 5m -- bash -c 'sudo apt-get $APT_OPTS update'
          .github/scripts/retry.sh 5 5m -- bash -c '
            sudo dpkg --configure -a &&
            sudo apt-get $APT_OPTS install -y cmake ninja-build gcc-multilib g++-multilib'

      - name: Build and run tests
        run: |
          cmake -S Firmware/RP2040/tests -B build-tests -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  # Code used by more than one firmware lives once in Firmware/common (Firmware/common/README.md).
  shared-sources:
    name: Shared sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shared sources
        run: python3 .github/scripts/check_shared_sources.py

  # The README's mode table is generated from the firmware source, and every relative link in the
  # Markdown files must point to a tracked file and an existing heading (docs/TESTING.md).
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Mode table matches the firmware
        run: python3 .github/scripts/gen_docs_tables.py --check
      - name: Links and anchors
        run: python3 .github/scripts/check_doc_links.py

  # Bluetooth side of the RP2040 + ESP32 hybrid (OGXM_BOARD=ESP32_BLUEPAD32_I2C). Same Bluepad32
  # submodule, patches and Firmware/common sources as the RP2040 builds, so a change that breaks
  # the ESP32 fails here.
  esp32-firmware:
    name: Firmware (ESP32 companion)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: espressif/idf:v5.5.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout required submodules
        run: |
          git config --global --add safe.directory '*'
          .github/scripts/retry.sh 5 10m -- git submodule update --init --recursive --depth 1 \
            Firmware/external/bluepad32 Firmware/external/libfixmath

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          cd Firmware/ESP32
          idf.py build

      # sdkconfig / dependencies.lock are committed for this ESP-IDF version: a build that
      # rewrites them means they were not regenerated after a version or Kconfig change.
      - name: Committed ESP-IDF config is current
        run: git diff --exit-code -- Firmware/ESP32/sdkconfig Firmware/ESP32/dependencies.lock

      - name: Collect binaries
        run: |
          mkdir -p out
          cp Firmware/ESP32/build/*.bin Firmware/ESP32/build/flasher_args.json out/
          cp Firmware/ESP32/build/bootloader/bootloader.bin Firmware/ESP32/build/partition_table/partition-table.bin out/

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-companion
          path: out/*

  firmware:
    name: Firmware (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Steps retry on their own (up to 5 attempts each); this only bounds the worst case.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PI_PICO2W
            board: PI_PICO2W
            build_type: Release
            flags: ""
          - name: PI_PICO2W-DebugLite
            board: PI_PICO2W
            build_type: Debug
            flags: ""
            cxxflags: "-DBLUEPAD32_UART_LOG_INPUT=0"
          # USB side of the Pico 2 / Pico 2 W + ESP32 hybrid (the RP2040 one is built by build.yml)
          - name: ESP32_BLUEPAD32_I2C_PICO2
            board: ESP32_BLUEPAD32_I2C_PICO2
            build_type: Release
            flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Checkout required submodules
        run: |
          .github/scripts/retry.sh 5 10m -- git submodule update --init --recursive --depth 1 \
            Firmware/external/bluepad32 Firmware/external/tinyusb \
            Firmware/external/Pico-PIO-USB Firmware/external/libfixmath

      # A slow cache download gives up after a few minutes and the SDK is cloned instead.
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        timeout-minutes: 8
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
        with:
          path: Firmware/external/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_TAG }}

      - name: Get Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          .github/scripts/retry.sh 5 10m -- bash -c "
            rm -rf Firmware/external/pico-sdk &&
            git clone --depth 1 --branch ${PICO_SDK_TAG} https://github.com/raspberrypi/pico-sdk.git Firmware/external/pico-sdk &&
            git -C Firmware/external/pico-sdk submodule update --init --depth 1"

      # apt-get install is the step seen hanging on runners: apt's own retries and timeouts,
      # finish any install a killed attempt left half-configured, 5 minutes per attempt.
      - name: Install toolchain
        env:
          APT_OPTS: >-
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=120
        run: |
          .github/scripts/retry.sh 5 5m -- bash -c 'sudo apt-get $APT_OPTS update'
          .github/scripts/retry.sh 5 5m -- bash -c '
            sudo dpkg --configure -a &&
            sudo apt-get $APT_OPTS install -y cmake ninja-build gcc-arm-none-eabi \
              libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3'

      - name: Build ${{ matrix.name }}
        env:
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: |
          .github/scripts/retry.sh 5 15m -- bash -c "
            cmake -S Firmware/RP2040 -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DOGXM_BOARD=${{ matrix.board }} -DMAX_GAMEPADS=1 \
              ${{ matrix.flags }} &&
            cmake --build build"
          mkdir -p out
          for f in build/*.uf2; do cp "$f" "out/$(basename "${f%.uf2}")-${{ matrix.name }}-${GITHUB_SHA::7}.uf2"; done

      - uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.name }}
          path: out/*.uf2
